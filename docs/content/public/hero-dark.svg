<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 140 140" width="400" height="400">
    <defs>
        <style>
      @keyframes shackle-rotate {
        0%    { transform: rotate(0deg); }
        20%   { transform: rotate(-24deg); }
        60%   { transform: rotate(-24deg); }
        85%   { transform: rotate(0deg); }
        100%  { transform: rotate(0deg); }
      }
      @keyframes shake {
        0%,84%,100% { transform: translateX(0px); }
        86%  { transform: translateX(-0.8px); }
        88%  { transform: translateX(0.8px); }
        90%  { transform: translateX(-0.8px); }
        92%  { transform: translateX(0.8px); }
        94%  { transform: translateX(-0.5px); }
        96%  { transform: translateX(0.5px); }
        98%  { transform: translateX(0px); }
      }
      @keyframes shadow-anim {
        0%    { opacity: 0.12; transform: scaleX(1); }
        20%   { opacity: 0.06; transform: scaleX(0.75); }
        60%   { opacity: 0.06; transform: scaleX(0.75); }
        85%   { opacity: 0.12; transform: scaleX(1); }
        100%  { opacity: 0.12; transform: scaleX(1); }
      }
      @keyframes ring1 {
        0%,82%   { r: 0;  opacity: 0.5; }
        95%,100% { r: 36; opacity: 0; }
      }
      @keyframes ring2 {
        0%,84%   { r: 0;  opacity: 0.35; }
        97%,100% { r: 44; opacity: 0; }
      }
      @keyframes ring3 {
        0%,86%   { r: 0;  opacity: 0.2; }
        99%,100% { r: 52; opacity: 0; }
      }
      .shackle {
        animation: shackle-rotate 4s ease-in-out infinite;
        transform-origin: 28px 52px;
      }
      .body {
        animation: shake 4s ease-in-out infinite;
        transform-origin: 50px 71px;
      }
      .shadow {
        animation: shadow-anim 4s ease-in-out infinite;
        transform-origin: 50px 108px;
      }
      .ring1 { animation: ring1 4s ease-out infinite; }
      .ring2 { animation: ring2 4s ease-out infinite; }
      .ring3 { animation: ring3 4s ease-out infinite; }
    </style>
    </defs>

    <!-- Shadow — lighter for dark bg -->
    <ellipse cx="50" cy="108" rx="28" ry="5" fill="#ffffff" opacity="0.08" class="shadow" />

    <!-- Ripple rings — grey so visible on dark -->
    <circle cx="50" cy="71" r="0" fill="none" stroke="#9aa5b4" stroke-width="1.5" class="ring1" />
    <circle cx="50" cy="71" r="0" fill="none" stroke="#9aa5b4" stroke-width="1" class="ring2" />
    <circle cx="50" cy="71" r="0" fill="none" stroke="#9aa5b4" stroke-width="0.75" class="ring3" />

    <g class="shackle">
        <path d="M28 52 L28 36 Q28 12 50 12 Q72 12 72 36 L72 52"
            fill="none" stroke="#9aa5b4" stroke-width="14" stroke-linecap="round" />
        <path d="M28 52 L28 36 Q28 12 50 12 Q72 12 72 36 L72 52"
            fill="none" stroke="#c8d0da" stroke-width="7" stroke-linecap="round" />
    </g>

    <g class="body">
        <rect x="16" y="48" width="68" height="50" rx="10" fill="#c87010" />
        <rect x="16" y="46" width="68" height="50" rx="10" fill="#f5a623" />
        <rect x="16" y="46" width="68" height="25" rx="10" fill="#f7b84b" opacity="0.6" />
        <circle cx="50" cy="66" r="7" fill="#5a6270" />
        <rect x="46.5" y="71" width="7" height="10" rx="2" fill="#5a6270" />
    </g>
</svg>